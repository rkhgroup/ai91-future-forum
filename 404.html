<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages SPA redirect
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      window.location.replace(window.location.origin + "/ai91-future-forum/" + "#" + path.replace("/ai91-future-forum", "") + search + hash);
    </script>
  </head>
  <body></body>
</html>
